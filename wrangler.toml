name = "web-app"
main = ".open-next/worker.js"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets configuration
# Enables direct edge CDN asset delivery with 0 ms CPU time and 0 billed Worker requests on the Free Plan.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "none"
run_worker_first = false

# Cloudflare Cron Triggers for background operational tasks (e.g. daily lead status updates)
[triggers]
crons = ["0 2 * * *"] # Daily at 02:00 UTC

