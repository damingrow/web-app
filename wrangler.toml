name = "damingrow"
main = ".open-next/worker.js"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets binding for Next.js static output
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Production KV namespace for Incremental Static Regeneration (ISR) cache
# [[kv_namespaces]]
# binding = "NEXT_CACHE_WORKERS_KV"
# id = "<YOUR_PRODUCTION_KV_ID>"

# Cloudflare Cron Triggers for background operational tasks (e.g. daily lead status updates)
[triggers]
crons = ["0 2 * * *"] # Daily at 02:00 UTC

